<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A0A0C">
<title>M &amp; A · Atendimento</title>
<style>
  :root{
    --bg:#0A0A0C; --surface:#131317; --surface-2:#191920; --line:#26262E;
    --text:#F2F0EC; --muted:#8C8C97; --faint:#5C5C66;
    --accent:#C9A96A; --accent-soft:rgba(201,169,106,.10); --accent-line:rgba(201,169,106,.28);
    --green:#4EA87A; --amber:#D9A648; --red:#C2604F; --blue:#6E8FB8;
    --serif:ui-serif,Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    --r:14px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1100px 620px at 82% -12%, rgba(201,169,106,.07), transparent 62%),
      radial-gradient(760px 460px at -8% 108%, rgba(110,143,184,.06), transparent 60%),
      var(--bg);
    color:var(--text); font-family:var(--sans);
    font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent-line);color:#fff}

  .label{
    font-size:10.5px; letter-spacing:.15em; text-transform:uppercase;
    color:var(--faint); font-weight:600;
  }
  .serif{font-family:var(--serif)}
  .muted{color:var(--muted)}

  /* ---------------- Login ---------------- */
  #login{min-height:100vh;display:grid;place-items:center;padding:24px}
  .login-card{
    width:100%;max-width:392px;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--r);
    padding:44px 38px 38px;text-align:center;
    box-shadow:0 30px 70px -30px rgba(0,0,0,.85);
  }
  .crest{
    width:60px;height:60px;margin:0 auto 22px;border-radius:50%;
    border:1px solid var(--accent-line);background:var(--accent-soft);
    display:grid;place-items:center;
    font-family:var(--serif);font-size:19px;color:var(--accent);letter-spacing:.02em;
  }
  .login-card h1{font-family:var(--serif);font-size:26px;font-weight:400;letter-spacing:.01em}
  .login-card .label{margin-top:9px;display:block}
  input[type=password],input[type=text]{
    width:100%;margin-top:26px;padding:13px 15px;background:#0C0C0F;
    border:1px solid var(--line);border-radius:9px;color:var(--text);
    font-family:var(--sans);font-size:15px;transition:border-color .18s;
  }
  input:focus{outline:none;border-color:var(--accent-line)}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:12px 20px;border:1px solid var(--line);border-radius:9px;
    background:var(--surface-2);color:var(--text);font-family:var(--sans);
    font-size:13.5px;font-weight:500;cursor:pointer;
    transition:border-color .18s,background .18s,transform .12s;
  }
  .btn:hover{border-color:var(--accent-line);background:#1E1E26}
  .btn:active{transform:translateY(1px)}
  .btn-primary{
    background:linear-gradient(180deg,#D8BC80,#C09A55);
    border-color:transparent;color:#241C0C;font-weight:600;
  }
  .btn-primary:hover{background:linear-gradient(180deg,#E2C88F,#C9A461)}
  .btn-block{width:100%;margin-top:18px}
  .btn-sm{padding:7px 12px;font-size:12px;border-radius:7px}
  .err{color:var(--red);font-size:12.5px;margin-top:14px;min-height:17px}

  /* ---------------- Shell ---------------- */
  #app{display:none;max-width:1240px;margin:0 auto;padding:26px 26px 72px}
  header.top{
    display:flex;align-items:center;justify-content:space-between;gap:20px;
    flex-wrap:wrap;padding-bottom:22px;margin-bottom:26px;
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:14px}
  .brand .crest{width:44px;height:44px;margin:0;font-size:14px}
  .brand h1{font-family:var(--serif);font-size:21px;font-weight:400;letter-spacing:.01em}
  .top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

  .pill{
    display:inline-flex;align-items:center;gap:7px;padding:6px 12px;
    border:1px solid var(--line);border-radius:99px;font-size:12px;color:var(--muted);
    background:var(--surface);
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
  .dot.on{background:var(--green);box-shadow:0 0 0 3px rgba(78,168,122,.16)}
  .dot.off{background:var(--red);box-shadow:0 0 0 3px rgba(194,96,79,.16)}
  .dot.warn{background:var(--amber);box-shadow:0 0 0 3px rgba(217,166,72,.16)}

  .bell{position:relative}
  .bell .count{
    position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;padding:0 5px;
    border-radius:99px;background:var(--accent);color:#241C0C;
    font-size:11px;font-weight:700;display:none;place-items:center;
  }
  .bell.has .count{display:grid}

  /* ---------------- Stats ---------------- */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
  .stat{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:17px 19px;
  }
  .stat .n{font-family:var(--serif);font-size:31px;line-height:1.1;font-weight:400}
  .stat .label{margin-top:5px;display:block}
  .stat.hi{border-color:var(--accent-line);background:linear-gradient(180deg,var(--accent-soft),transparent)}
  .stat.hi .n{color:var(--accent)}

  /* ---------------- Panels ---------------- */
  .grid{display:grid;grid-template-columns:1fr;gap:16px}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .panel-head{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap;
  }
  .panel-head h2{font-family:var(--serif);font-size:16.5px;font-weight:400}
  .panel-body{padding:20px}
  .panel-body.flush{padding:0}
  .two{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}

  /* ---------------- Table ---------------- */
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{
    text-align:left;padding:11px 16px;background:#101014;
    font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--faint);font-weight:600;white-space:nowrap;
    border-bottom:1px solid var(--line);
  }
  td{padding:13px 16px;border-bottom:1px solid rgba(38,38,46,.6);vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr{transition:background .15s}
  tbody tr:hover{background:rgba(255,255,255,.017)}
  tbody tr.fresh{background:var(--accent-soft)}
  tbody tr.fresh td:first-child{box-shadow:inset 2px 0 0 var(--accent)}
  .who{font-weight:500}
  .tel{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .when{font-size:12.5px;color:var(--muted);white-space:nowrap}
  .veh{color:var(--muted)}

  select{
    padding:6px 10px;background:#0C0C0F;border:1px solid var(--line);
    border-radius:7px;color:var(--text);font-family:var(--sans);font-size:12.5px;cursor:pointer;
  }
  select:focus{outline:none;border-color:var(--accent-line)}
  select.s-pending{border-color:rgba(217,166,72,.5);color:var(--amber)}
  select.s-contacted{border-color:rgba(110,143,184,.5);color:var(--blue)}
  select.s-completed{border-color:rgba(78,168,122,.5);color:var(--green)}
  select.s-rejected{border-color:rgba(194,96,79,.5);color:var(--red)}

  .row-actions{display:flex;gap:6px;white-space:nowrap}
  a.link{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent}
  a.link:hover{border-bottom-color:var(--accent-line)}

  .empty{padding:52px 20px;text-align:center;color:var(--faint)}
  .empty .serif{font-size:17px;color:var(--muted);display:block;margin-bottom:6px}

  /* ---------------- Feed ---------------- */
  .feed{max-height:430px;overflow-y:auto;padding:14px 18px}
  .msg{padding:9px 12px;border-radius:9px;margin-bottom:9px;font-size:13px;border:1px solid transparent}
  .msg .label{display:block;margin-bottom:3px;font-size:9.5px}
  .msg.in{background:#15151A;border-color:var(--line)}
  .msg.out{background:var(--accent-soft);border-color:var(--accent-line)}
  .msg p{white-space:pre-wrap;word-break:break-word;color:var(--text);opacity:.92}

  /* ---------------- Setup ---------------- */
  .kv{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid rgba(38,38,46,.55);font-size:13px}
  .kv:last-child{border-bottom:none}
  .kv b{font-weight:500;color:var(--muted)}
  .kv span{text-align:right;word-break:break-all}
  code{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;
    background:#0C0C0F;border:1px solid var(--line);border-radius:5px;padding:2px 6px;
  }
  .qr{margin-top:16px;text-align:center}
  .qr img{width:236px;height:236px;background:#fff;padding:10px;border-radius:10px}

  /* ---------------- Toast ---------------- */
  #toasts{position:fixed;right:20px;bottom:20px;z-index:60;display:flex;flex-direction:column;gap:10px}
  .toast{
    min-width:270px;max-width:352px;background:var(--surface-2);
    border:1px solid var(--accent-line);border-left:3px solid var(--accent);
    border-radius:11px;padding:13px 16px;
    box-shadow:0 22px 50px -18px rgba(0,0,0,.9);
    animation:slide .32s cubic-bezier(.2,.8,.2,1);
  }
  .toast .label{display:block;margin-bottom:3px;color:var(--accent)}
  .toast p{font-size:13.5px}
  @keyframes slide{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}

  @media(max-width:900px){
    .two{grid-template-columns:1fr}
    .stats{grid-template-columns:repeat(2,1fr)}
  }
  @media(max-width:560px){
    #app{padding:18px 15px 60px}
    .panel-body{padding:15px}
  }
</style>
</head>
<body>

<!-- ============ Login ============ -->
<section id="login">
  <div class="login-card">
    <div class="crest serif">M&amp;A</div>
    <h1 class="serif">Atendimento</h1>
    <span class="label">M &amp; A Lava a Jato · Sobral</span>
    <form id="loginForm" autocomplete="off">
      <input type="password" id="pwd" placeholder="Senha de acesso" autocomplete="current-password">
      <button class="btn btn-primary btn-block" type="submit">Entrar</button>
    </form>
    <div class="err" id="loginErr"></div>
  </div>
</section>

<!-- ============ App ============ -->
<main id="app">
  <header class="top">
    <div class="brand">
      <div class="crest serif">M&amp;A</div>
      <div>
        <h1 class="serif">Central de Atendimento</h1>
        <span class="label">Triagem automática · WhatsApp</span>
      </div>
    </div>
    <div class="top-right">
      <span class="pill" id="pillWa"><i class="dot"></i> WhatsApp</span>
      <span class="pill" id="pillWh"><i class="dot"></i> Webhook</span>
      <button class="btn btn-sm bell" id="bell" title="Marcar notificações como vistas">
        Novas <span class="count" id="bellCount">0</span>
      </button>
      <button class="btn btn-sm" id="btnLogout">Sair</button>
    </div>
  </header>

  <section class="stats">
    <div class="stat hi"><div class="n" id="sPending">—</div><span class="label">Aguardando</span></div>
    <div class="stat"><div class="n" id="sContacted">—</div><span class="label">Em atendimento</span></div>
    <div class="stat"><div class="n" id="sCompleted">—</div><span class="label">Concluídas</span></div>
    <div class="stat"><div class="n" id="sTotal">—</div><span class="label">Total</span></div>
  </section>

  <div class="grid">
    <div class="panel">
      <div class="panel-head">
        <h2 class="serif">Solicitações</h2>
        <button class="btn btn-sm" id="btnReload">Atualizar</button>
      </div>
      <div class="panel-body flush">
        <div class="scroll">
          <table>
            <thead><tr>
              <th>Cliente</th><th>Assunto</th><th>Veículo</th>
              <th>Recebido</th><th>Situação</th><th></th>
            </tr></thead>
            <tbody id="rows">
              <tr><td colspan="6" class="empty"><span class="serif">Carregando…</span></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="two">
      <div class="panel">
        <div class="panel-head"><h2 class="serif">Fluxo de mensagens</h2><span class="label" id="feedCount"></span></div>
        <div class="panel-body flush"><div class="feed" id="feed"></div></div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2 class="serif">Conexão</h2>
          <button class="btn btn-sm" id="btnSync">Sincronizar webhook</button>
        </div>
        <div class="panel-body" id="conn"></div>
      </div>
    </div>
  </div>
</main>

<div id="toasts"></div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const api = (p, o = {}) => fetch('/admin/api' + p, {
  ...o,
  headers: { 'Content-Type': 'application/json',
             Authorization: 'Bearer ' + localStorage.getItem('maToken'), ...(o.headers || {}) }
});

let knownUnseen = new Set();
let firstLoad = true;
let timer = null;

/* ---------------- Login ---------------- */
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('#loginErr').textContent = '';
  try {
    const r = await fetch('/admin/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: $('#pwd').value })
    });
    if (!r.ok) { $('#loginErr').textContent = 'Senha incorreta.'; return; }
    const { token } = await r.json();
    localStorage.setItem('maToken', token);
    unlockAudio();
    if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
    boot();
  } catch { $('#loginErr').textContent = 'Falha de conexão.'; }
});

$('#btnLogout').onclick = () => { localStorage.removeItem('maToken'); clearInterval(timer); location.reload(); };
$('#btnReload').onclick = () => refresh();

function boot() {
  $('#login').style.display = 'none';
  $('#app').style.display = 'block';
  refresh();
  clearInterval(timer);
  timer = setInterval(refresh, 6000);
}

if (localStorage.getItem('maToken')) boot();

/* ---------------- Refresh ---------------- */
async function refresh() {
  try {
    const [tr, st, ms, sr] = await Promise.all([
      api('/triages?limit=120'), api('/stats'), api('/messages?limit=100'), api('/status')
    ]);
    if (tr.status === 401) { localStorage.removeItem('maToken'); location.reload(); return; }

    const triages = await tr.json();
    renderStats(await st.json());
    renderTriages(triages);
    renderFeed(await ms.json());
    renderStatus(await sr.json());
    checkNew(triages);
  } catch (e) { console.error('refresh', e); }
}

/* ---------------- Notificação ---------------- */
function checkNew(triages) {
  const unseen = triages.filter(t => !t.seen && t.status === 'pending');
  const ids = new Set(unseen.map(t => t.id));

  const novas = unseen.filter(t => !knownUnseen.has(t.id));
  if (!firstLoad && novas.length) {
    chime();
    novas.forEach(t => {
      toast('Nova solicitação', `${t.name || 'Cliente'} · ${t.subject || '—'} · ${t.vehicle || '—'}`);
      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification('M & A · Nova solicitação', {
          body: `${t.name || 'Cliente'} — ${t.subject || ''}\n${t.vehicle || ''}`,
          tag: 'triage-' + t.id
        });
      }
    });
  }

  knownUnseen = ids;
  firstLoad = false;

  const bell = $('#bell');
  $('#bellCount').textContent = ids.size;
  bell.classList.toggle('has', ids.size > 0);
  document.title = ids.size ? `(${ids.size}) M & A · Atendimento` : 'M & A · Atendimento';
}

$('#bell').onclick = async () => {
  const ids = [...knownUnseen];
  if (!ids.length) return;
  await api('/triages/seen', { method: 'POST', body: JSON.stringify({ ids }) });
  refresh();
};

let audioCtx = null;
function unlockAudio() {
  try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch {}
}
function chime() {
  if (!audioCtx) return;
  const notes = [[880, 0], [1174.7, 0.13]];
  notes.forEach(([freq, delay]) => {
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.13, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + 0.45);
  });
}

function toast(title, body) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span class="label"></span><p></p>`;
  el.querySelector('.label').textContent = title;
  el.querySelector('p').textContent = body;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; }, 7000);
  setTimeout(() => el.remove(), 7400);
}

/* ---------------- Render ---------------- */
function renderStats(s) {
  $('#sPending').textContent = s.pending || 0;
  $('#sContacted').textContent = s.contacted || 0;
  $('#sCompleted').textContent = s.completed || 0;
  $('#sTotal').textContent = s.total || 0;
}

const STATUS = { pending: 'Aguardando', contacted: 'Em atendimento', completed: 'Concluída', rejected: 'Descartada' };

function fone(p) {
  const d = String(p || '').replace(/\D/g, '');
  const n = d.startsWith('55') ? d.slice(2) : d;
  if (n.length === 11) return `(${n.slice(0,2)}) ${n.slice(2,7)}-${n.slice(7)}`;
  if (n.length === 10) return `(${n.slice(0,2)}) ${n.slice(2,6)}-${n.slice(6)}`;
  return p;
}

/**
 * Um timestamp sem marcador de fuso é UTC do banco — sem o "Z" o navegador
 * o leria como hora local e o "recebido há X" sairia deslocado.
 */
function parseUTC(iso) {
  const s = String(iso || '');
  return new Date(/[Zz]|[+-]\d{2}:?\d{2}$/.test(s) ? s : s.replace(' ', 'T') + 'Z');
}

function quando(iso) {
  const d = parseUTC(iso);
  const diff = (Date.now() - d.getTime()) / 60000;
  if (diff < 1) return 'agora';
  if (diff < 60) return `${Math.floor(diff)} min`;
  if (diff < 1440) return `${Math.floor(diff / 60)} h`;
  return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' });
}

function renderTriages(list) {
  const tb = $('#rows');
  if (!list.length) {
    tb.innerHTML = `<tr><td colspan="6" class="empty">
      <span class="serif">Nenhuma solicitação ainda</span>
      As triagens do WhatsApp aparecem aqui automaticamente.</td></tr>`;
    return;
  }

  tb.innerHTML = '';
  for (const t of list) {
    const tr = document.createElement('tr');
    if (!t.seen && t.status === 'pending') tr.className = 'fresh';

    const td = html => { const c = document.createElement('td'); c.innerHTML = html; return c; };

    const c1 = document.createElement('td');
    const who = document.createElement('div'); who.className = 'who'; who.textContent = t.name || 'Cliente';
    const tel = document.createElement('div'); tel.className = 'tel'; tel.textContent = fone(t.phone);
    c1.append(who, tel);

    const c2 = document.createElement('td'); c2.textContent = t.subject || '—';
    const c3 = document.createElement('td'); c3.className = 'veh'; c3.textContent = t.vehicle || '—';
    const c4 = td(`<span class="when">${quando(t.created_at)}</span>`);
    c4.title = parseUTC(t.created_at).toLocaleString('pt-BR');

    const c5 = document.createElement('td');
    const sel = document.createElement('select');
    sel.className = 's-' + t.status;
    for (const [v, lbl] of Object.entries(STATUS)) {
      const o = document.createElement('option');
      o.value = v; o.textContent = lbl; o.selected = t.status === v;
      sel.appendChild(o);
    }
    sel.onchange = async () => {
      await api('/triages/' + t.id, { method: 'PUT', body: JSON.stringify({ status: sel.value }) });
      refresh();
    };
    c5.appendChild(sel);

    const c6 = document.createElement('td');
    const acts = document.createElement('div'); acts.className = 'row-actions';
    const wa = document.createElement('a');
    wa.className = 'btn btn-sm'; wa.target = '_blank'; wa.rel = 'noopener';
    wa.href = 'https://wa.me/' + String(t.phone).replace(/\D/g, '');
    wa.textContent = 'Abrir chat';
    const rb = document.createElement('button');
    rb.className = 'btn btn-sm'; rb.textContent = 'Reativar bot';
    rb.title = 'Devolve este número para a triagem automática';
    rb.onclick = async () => {
      if (!confirm(`Reativar a triagem automática para ${t.name || t.phone}?`)) return;
      await api(`/sessions/${encodeURIComponent(t.phone)}/reactivate`, { method: 'POST' });
      toast('Bot reativado', `${t.name || t.phone} volta para a triagem automática.`);
    };
    acts.append(wa, rb);
    c6.appendChild(acts);

    tr.append(c1, c2, c3, c4, c5, c6);
    tb.appendChild(tr);
  }
}

function renderFeed(list) {
  const f = $('#feed');
  $('#feedCount').textContent = list.length ? `${list.length} recentes` : '';
  if (!list.length) { f.innerHTML = `<div class="empty"><span class="serif">Sem mensagens</span></div>`; return; }

  f.innerHTML = '';
  for (const m of list) {
    const d = document.createElement('div');
    d.className = 'msg ' + (m.direction === 'in' ? 'in' : 'out');
    const lb = document.createElement('span'); lb.className = 'label';
    lb.textContent = `${m.direction === 'in' ? 'Cliente' : 'Bot'} · ${fone(m.phone)} · ${quando(m.created_at)}`;
    const p = document.createElement('p'); p.textContent = m.body || '';
    d.append(lb, p);
    f.appendChild(d);
  }
}

function renderStatus(s) {
  const wa = s.whatsapp || {}, wh = s.webhook || {};

  const pw = $('#pillWa'); pw.querySelector('.dot').className = 'dot ' + (wa.connected ? 'on' : 'off');
  pw.lastChild.textContent = wa.connected ? ` WhatsApp ${wa.profileName ? '· ' + wa.profileName : ''}` : ' WhatsApp offline';

  const ph = $('#pillWh'); ph.querySelector('.dot').className = 'dot ' + (wh.correct ? 'on' : 'warn');
  ph.lastChild.textContent = wh.correct ? ' Webhook ok' : ' Webhook a ajustar';

  const rows = [
    ['Instância', s.instance],
    ['Número', wa.ownerJid ? fone(wa.ownerJid.split('@')[0]) : '—'],
    ['Situação', wa.connected ? 'Conectado' : (wa.error || wa.status || 'Desconectado')],
    ['Webhook atual', wh.url || '—'],
    ['Webhook esperado', wh.expected || '—'],
    ['Eventos', (wh.events || []).join(', ') || '—']
  ];

  const box = $('#conn');
  box.innerHTML = rows.map(([k, v]) =>
    `<div class="kv"><b>${k}</b><span>${String(v).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}</span></div>`
  ).join('');

  if (!wa.connected) {
    const d = document.createElement('div'); d.className = 'qr';
    d.innerHTML = `<span class="label">Escaneie para conectar</span><div id="qrSlot" style="margin-top:10px"></div>`;
    box.appendChild(d);
    api('/qr').then(r => r.json()).then(q => {
      const slot = document.getElementById('qrSlot');
      if (!slot) return;
      if (q.base64) slot.innerHTML = `<img src="${q.base64.startsWith('data:') ? q.base64 : 'data:image/png;base64,' + q.base64}" alt="QR Code">`;
      else slot.innerHTML = `<span class="muted" style="font-size:12.5px">QR indisponível — reinicie a instância na Evolution.</span>`;
    }).catch(() => {});
  }
}

$('#btnSync').onclick = async () => {
  const r = await api('/webhook/sync', { method: 'POST' });
  const j = await r.json();
  if (r.ok) toast('Webhook sincronizado', j.url);
  else toast('Falha', j.error || 'Não foi possível sincronizar');
  refresh();
};
</script>
</body>
</html>
